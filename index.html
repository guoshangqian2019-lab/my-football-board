<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>坦途足球俱乐部 - 4人盲盒选人系统</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --green: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; max-width: 480px; margin: 0 auto; -webkit-tap-highlight-color: transparent; }
        
        header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        header h1 { color: var(--gold); font-size: 1.3rem; margin-bottom: 4px; letter-spacing: 1px; }
        header p { color: var(--text-sub); font-size: 0.8rem; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h2 { font-size: 1rem; color: var(--gold); margin-bottom: 12px; border-left: 3px solid var(--gold); padding-left: 8px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-item { display: flex; flex-direction: column; }
        .input-item label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 0.95rem; outline: none; }
        input:focus { border-color: var(--gold); }
        
        button { background: linear-gradient(135deg, #d4af37, #aa8c2c); color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        button.secondary { background: #2a2a2a; color: var(--gold); border: 1px solid var(--gold); margin-top: 10px; }
        
        .status-bar { font-size: 0.9rem; background: #1a2530; padding: 10px; border-radius: 6px; margin-bottom: 15px; color: #64b5f6; text-align: center; font-weight: bold; border: 1px solid #2c3e50; }
        
        /* 盲盒网格布局 */
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .blind-box {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid var(--gold);
            border-radius: 12px;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .blind-box:active { transform: scale(0.95); }
        .blind-box.opened {
            background: #252525;
            border-color: var(--green);
            cursor: default;
            box-shadow: none;
        }
        .box-icon { font-size: 2rem; margin-bottom: 4px; transition: transform 0.3s; }
        .box-title { font-size: 0.85rem; font-weight: bold; color: var(--gold-light); }
        .box-result { font-size: 1.1rem; font-weight: bold; color: var(--green); margin-top: 4px; text-align: center; word-break: break-all; padding: 0 5px; }

        /* 明细看板 */
        .results-list { list-style: none; }
        .results-list li { background: #252525; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; border-left: 3px solid var(--gold); }
    </style>
</head>
<body>

    <header>
        <h1>坦途 - 4人盲盒选人系统</h1>
        <p>输入4位球员 · 随机打乱 · 依次翻牌</p>
    </header>

    <!-- 设置区：输入4位球员 -->

        <h2>输入本轮 4 位球员姓名</h2>

            <div class="input-item"><label>球员 2</label><input type="text" id="p2"
